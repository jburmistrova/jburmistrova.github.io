<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script>
	(function () {
		var saved = localStorage.getItem("theme");
		if (saved === "light" || saved === "dark") {
			document.documentElement.setAttribute("data-theme", saved);
		}
	})();
	</script>
	<title>{{ page.title }}{% unless page.title contains "Julia Burmistrova" %} · Julia Burmistrova{% endunless %}</title>
	<meta name="description" content="{{ page.description | default: site.description }}">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="stylesheet" type="text/css" href="/css/main.css">

	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Julia Burmistrova">
	<meta property="og:title" content="{{ page.title }}{% unless page.title contains "Julia Burmistrova" %} · Julia Burmistrova{% endunless %}">
	<meta property="og:description" content="{{ page.description | default: site.description }}">
	<meta property="og:image" content="{{ site.url }}/images/og-image.jpg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:url" content="{{ site.url }}{{ page.url }}">
	<meta name="twitter:card" content="summary">
</head>
<body>
	<nav class="top">
		<div class="wrap">
			<a class="mark" href="/">Julia Burmistrova</a>
			<div class="nav-right">
				<ul>
					<li><a href="/" {% if page.nav == "home" %}class="current"{% endif %}>Home</a></li>
					<li><a href="/#about" {% if page.nav == "about" %}class="current"{% endif %}>About</a></li>
					<li><a href="/#projects" {% if page.nav == "projects" %}class="current"{% endif %}>Projects</a></li>
					<li><a href="/field-notes/" {% if page.nav == "field-notes" %}class="current"{% endif %}>Field Notes</a></li>
					<li><a href="/#contact" {% if page.nav == "contact" %}class="current"{% endif %}>Contact</a></li>
					<li><a href="https://www.linkedin.com/in/juliaburmistrova/" target="_blank" rel="noopener" data-goatcounter-click="linkedin-nav">LinkedIn <span class="ext" aria-hidden="true">↗</span></a></li>
					<li><a href="https://github.com/jburmistrova" target="_blank" rel="noopener" data-goatcounter-click="github-nav">GitHub <span class="ext" aria-hidden="true">↗</span></a></li>
				</ul>
				<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme">
					<svg class="icon-sun" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="4"/><path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M3.5 16.5l1.4-1.4M15.1 4.9l1.4-1.4"/></svg>
					<svg class="icon-moon" viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><path d="M15 10.5A6.5 6.5 0 018.2 3a7 7 0 108.3 8.3c-.5.13-1 .2-1.5.2z"/></svg>
				</button>
			</div>
		</div>
	</nav>

	{{ content }}

	<footer class="site-footer">
		<div class="wrap">
			<div class="meta">© {{ 'now' | date: "%Y" }} Julia Burmistrova</div>
		</div>
	</footer>

	<script>
	(function () {
		var btn = document.getElementById("theme-toggle");
		if (!btn) return;
		btn.addEventListener("click", function () {
			var current = document.documentElement.getAttribute("data-theme");
			if (!current) {
				current = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
			}
			var next = current === "dark" ? "light" : "dark";
			document.documentElement.setAttribute("data-theme", next);
			localStorage.setItem("theme", next);
		});
	})();
	</script>

	<script data-goatcounter="https://jburmistrova.goatcounter.com/count"
	        async src="//gc.zgo.at/count.js"></script>
	<script>
	console.log(
		"%cHey, if you're reading this in the console, let's talk data pipelines.",
		"color: #2f6f6a; font-family: monospace; font-size: 13px;"
	);
	</script>
</body>
</html>
